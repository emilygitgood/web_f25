            transition-duration: 2s;

            height: 500px;
        }

        @keyframes moving-box {
            from {
                left: 0px;
                top: 0px;
                background-color: red;
            }

            25% {
                left: 500px;
                top: 0px;
                background-color: blue;
            }

            50% {

            75% {

                background-color: green;
            }
