<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOKS!</title>
    <link rel="stylesheet" href="wa11.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mansalva&display=swap" rel="stylesheet">


</head>
<body>
    <div class="app">
        <h1>Book Finder!</h1>
    </div>

    <div class="search-section">
        <input
          type="text"
        id="search-input"
        placeholder="Search for a book title or author"
        class="search-input"
        >
    </div>

    <div class="book-display">
        <div id="book-info"></div>
    </div>

    <div class="controls">
        <button type="button" id="random-btn" class="button new-quote">
            Randomize A Book! 
        </button>

           <button type="button" id="search-btn" class="button search-button">
            Search Book Titles
        </button>
        
    </div>

    <div class="privacy-section">
        <h3>Favorites</h3>
        <p class="fav-info">
            Your favorites can be stored, exported, or deleted here! 
        </p>
        
        <div class="data-controls">
              <button type="button" id="view-favorites-btn" class="button-feed">
            View My Favorites
        </button>
            <button type="button" id="clear-btn" class="button clear-button">
                Clear All Favorites
            </button>

            <button type="button" id="export-btn" class="button export-button">
                Export My Favorites
            </button>
        </div>
        <p class="favorites-count">
            You have <span id="count">0</span> saved favorites!
        </p>
    </div>

    <footer>Privacy Information: Your favorites are stored locally on your device only. Nothing is sent to other servers!</footer>
    
    <script src="wa11.js"></script>

</body>
</html>
